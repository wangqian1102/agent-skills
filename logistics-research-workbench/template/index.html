<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流项目调研计划工作台</title>
<style>
:root{
  --primary:#1a3a6b; --primary-light:#eef3fa; --accent:#2563eb;
  --ok:#15803d; --warn:#b45309; --line:#e2e8f0; --text:#1e293b; --sub:#64748b; --bg:#f5f7fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1080px;margin:0 auto;padding:16px}
header{background:var(--primary);color:#fff;padding:18px 0}
header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:20px;font-weight:600}
header .h-meta{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.9}
#cityBadge{background:rgba(255,255,255,.15);padding:2px 10px;border-radius:12px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#24549b;color:#fff}
.btn-ghost-light{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn-ghost-light:hover{border-color:#fff;color:#fff}
/* 步骤条 */
.steps{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap}
.step-tab{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:center;font-size:13px;color:var(--sub);transition:.15s}
.step-tab .num{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;margin-right:4px}
.step-tab.active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.step-tab.active .num{background:var(--primary)}
.step-tab.done .num{background:var(--ok)}
/* 卡片 */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:12px;color:var(--primary)}
.card h3{font-size:14px;margin:14px 0 8px}
.hint{font-size:12px;color:var(--sub)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form-item label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.form-item input,.form-item select,.form-item textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
.form-item textarea{min-height:72px;resize:vertical}
/* 总览 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--primary-light);border-radius:8px;padding:12px}
.kpi .k-label{font-size:12px;color:var(--sub)}
.kpi .k-value{font-size:18px;font-weight:600;color:var(--primary)}
.kpi .k-sub{font-size:12px;color:var(--sub)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.tbl th{background:var(--primary-light);color:var(--primary);font-weight:600}
.tbl-wrap{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin:2px 3px 2px 0;background:var(--primary-light);color:var(--primary)}
.src{font-size:12px;color:var(--sub);margin-top:6px}
.demand-high{color:var(--ok);font-weight:600}
.demand-mid{color:var(--warn);font-weight:600}
/* 勾选行 */
.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff;transition:.12s}
.check-row:hover{border-color:var(--accent)}
.check-row input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--primary);flex-shrink:0}
.check-row .cr-main{flex:1;min-width:0}
.cr-title{font-size:14px;font-weight:600}
.cr-sub{font-size:12px;color:var(--sub)}
.badge{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600}
.badge-primary{background:#dcfce7;color:#15803d}
.badge-backup{background:#fef3c7;color:#b45309}
.badge-type{background:var(--primary-light);color:var(--primary);font-weight:500;margin-right:6px}
.swap-btn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;padding:2px 8px;cursor:pointer;color:var(--sub);flex-shrink:0}
.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
.n-input{width:64px !important;padding:4px 6px !important;border:1px solid var(--line);border-radius:6px;font-size:13px}
.ind-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ind-head .cr-title{flex:1}
.park-status{font-size:13px;color:var(--sub);margin:10px 0 6px}
.firm-list{margin:8px 0 4px 28px}
.firm-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:13px;flex-wrap:wrap}
.firm-row:hover{background:var(--primary-light)}
.firm-row .f-name{font-weight:500}
.firm-row .f-loc{color:var(--sub);font-size:12px}
/* 导航 */
.nav-bar{display:flex;justify-content:space-between;margin:18px 0 30px}
/* 汇总 */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.sum-item .s-num{font-size:24px;font-weight:700;color:var(--primary)}
.sum-item .s-label{font-size:12px;color:var(--sub)}
footer{padding:20px 0;color:var(--sub);font-size:12px;text-align:center}
.section{display:none}
.section.active{display:block}
@media (max-width:640px){
  .nav-bar{flex-direction:column;gap:8px}
  .nav-bar .btn{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>物流项目调研计划工作台</h1>
    <div class="h-meta">
      <span id="cityBadge">未选择城市</span>
      <span id="saveHint">已自动保存</span>
      <button class="btn btn-ghost-light" id="btnReset">重置</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="steps" id="stepBar"></div>
  <div id="sections"></div>
  <div class="nav-bar">
    <button class="btn" id="btnPrev">← 上一步</button>
    <button class="btn btn-primary" id="btnNext">下一步 →</button>
  </div>
</div>

<footer>调研计划工作台 · 深度分析结论由调研准备阶段预置，关键数据来源见各条目标注</footer>

<script src="data.js"></script>
<script src="docx.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
